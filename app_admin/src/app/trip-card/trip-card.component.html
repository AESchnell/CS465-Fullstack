<article class="card h-100 shadow-sm">
  <img class="card-img-top" [src]="'/images/' + trip().image" [alt]="trip().name">
  <div class="card-body d-flex flex-column">
    <div class="small text-secondary mb-1">{{ trip().code }}</div>
    <h2 class="h4 card-title">{{ trip().name }}</h2>
    <p class="text-secondary mb-2">{{ trip().resort }}</p>
    <p class="small mb-2">{{ trip().length }} · {{ trip().start | date:'mediumDate':'UTC' }}</p>
    <p class="fw-bold text-success">{{ trip().perPerson | currency:'USD' }} <span class="fw-normal text-secondary small">per person</span></p>
    <div class="trip-description small" [innerHTML]="trip().description"></div>
    @if (canEdit()) { <div class="d-flex gap-2 mt-auto pt-3"><a class="btn btn-outline-primary" [routerLink]="['/edit-trip', trip().code]" [attr.aria-label]="'Edit ' + trip().name">Edit trip</a>
      <button class="btn btn-outline-danger" [disabled]="busy()" (click)="deleteTrip.emit(trip())" [attr.aria-label]="'Delete ' + trip().name">Delete</button></div> }
  </div>
</article>
